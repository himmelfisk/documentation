<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Documentation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="language-bar">
    <select id="language-selector">
      <option value="en">English</option>
      <option value="no">Norsk</option>
    </select>
  </div>

  <div id="app">
    <h1 data-i18n="app.title">Dokumentasjon</h1>
    <p data-i18n="app.welcome">Velkommen til Dokumentasjon-appen.</p>

    <div id="photo-section">
      <button id="take-photo-btn" data-i18n="photo.addButton">📷 Send inn dokumentasjon</button>
      <div id="photo-preview">
        <img id="photo-image" alt="Captured photo" data-i18n="photo.altText" data-i18n-attr="alt" hidden>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
