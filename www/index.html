<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Documentation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="language-bar">
    <select id="language-selector">
      <option value="en">English</option>
      <option value="no">Norsk</option>
    </select>
  </div>

  <!-- Login screen – visible until authenticated -->
  <div id="login-screen">
    <div class="login-card">
      <h1 data-i18n="login.title">Logg inn</h1>
      <p data-i18n="login.subtitle">Logg inn med din Microsoft-konto for å fortsette.</p>
      <button id="login-btn" data-i18n="login.button">Logg inn med Microsoft</button>
      <p id="login-error" class="login-error" hidden></p>
    </div>
  </div>

  <!-- Main app – hidden until authenticated -->
  <div id="app" hidden>
    <div id="user-bar">
      <span id="user-name"></span>
      <button id="logout-btn" data-i18n="login.logout">Logg ut</button>
    </div>

    <h1 data-i18n="app.title">Dokumentasjon</h1>
    <p data-i18n="app.welcome">Velkommen til Dokumentasjon-appen.</p>

    <div id="photo-section">
      <button id="take-photo-btn" data-i18n="photo.addButton">📷 Send inn dokumentasjon</button>
      <div id="photo-preview">
        <img id="photo-image" alt="Captured photo" data-i18n="photo.altText" data-i18n-attr="alt" hidden>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
